<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>采集库助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header><div><span>ASSET LIBRARY</span><h1>采集库助手</h1></div><button id="openDashboard" class="outline" title="打开看板">▦</button></header>
    <section class="site-card"><div><b id="siteHost">当前网站</b><small id="siteStatus">正在检查白名单</small></div><button id="allowSite" class="allow">加入白名单</button></section>
    <section class="control"><div class="collector-owner"><span>采集人</span><b>张璇</b></div></section>
    <section class="modes" aria-label="采集模式"><button class="mode active" data-mode="inspiration">素材</button><button class="mode" data-mode="icon">Icon</button><button class="mode" data-mode="store">商店图</button></section>
    <section class="capture-card"><h2 id="modeTitle">通用素材采集</h2><p id="modeHint">扫描当前页面中的可用图片，最多保存 40 张。</p><button id="capture" class="capture">开始采集</button></section>
    <section class="whitelist"><div class="section-head"><b>白名单</b><span id="count"></span></div><div id="whitelistItems" class="whitelist-items"></div></section>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
